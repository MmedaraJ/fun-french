<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coco gallery</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root {
        --bg: #fff4e6;
        --card: #ffffff;
        --ink: #2b2d42;
        --muted: #7a7c92;
        --accent: #ff5e7e;
        --line: #f1dfcf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
      }
      h2 {
        margin: 40px 0 12px;
        font-size: 19px;
      }
      p.lead {
        margin: 0 0 16px;
        color: var(--muted);
      }
      button {
        font: inherit;
        border: 2px solid var(--ink);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: var(--ink);
        color: #fff;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 20px;
        padding: 16px;
      }
      .playground {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 24px;
        align-items: center;
      }
      .stage {
        display: grid;
        place-items: center;
        width: 300px;
        height: 300px;
        border-radius: 24px;
        background: var(--bg);
      }
      .grid {
        display: grid;
        grid-template-columns: 110px repeat(6, minmax(0, 1fr));
        gap: 8px;
        align-items: center;
      }
      .grid .head {
        font-weight: 600;
        text-align: center;
        text-transform: capitalize;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .grid .mood {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
        font-weight: 600;
        text-transform: capitalize;
      }
      .cell {
        display: grid;
        place-items: center;
        min-width: 0;
        background: var(--card);
        border-radius: 16px;
        padding: 6px 0;
      }
      .cell svg {
        max-width: 100%;
        height: auto;
      }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .sizes figure {
        flex: 1 0 auto;
      }
      .sizes figure,
      .statics figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: var(--card);
        border-radius: 16px;
        padding: 8px 4px;
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        text-transform: capitalize;
      }
      .statics {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
      }
      .statics figure {
        min-width: 0;
      }
      .statics img {
        max-width: 100%;
        height: auto;
      }
      .icons {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
      }
      .icons figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .mask {
        border-radius: 50%;
        overflow: hidden;
      }
      .dark {
        background: #23243a;
      }
      @media (max-width: 760px) {
        .playground {
          grid-template-columns: 1fr;
        }
        .grid {
          grid-template-columns: 72px repeat(6, minmax(0, 1fr));
          gap: 4px;
        }
        .statics {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./mascot.tsx"></script>
  </body>
</html>
